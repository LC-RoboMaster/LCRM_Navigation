name: Robot description
on:
  push:
    paths: ['src/lc_robot_description/**', 'urdf_temp/**', 'src/pb2025_sentry_nav/pb2025_nav_bringup/launch/**', 'src/pb2025_sentry_nav/pb2025_nav_bringup/config/reality/**', 'src/pb2025_sentry_nav/pb2025_nav_bringup/test/robot_model_launch_test.py', '.github/workflows/robot_description.yml']
  pull_request:
  workflow_dispatch:
jobs:
  humble:
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions python3-yaml liburdfdom-tools ros-humble-robot-state-publisher ros-humble-joint-state-publisher ros-humble-nav2-common ros-humble-ament-cmake-auto ros-humble-rclcpp-components ros-humble-tf2-geometry-msgs ros-humble-example-interfaces
      - name: Build and validate model
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select lc_passage_msgs fake_vel_transform lc_robot_description --executor sequential --cmake-args -DBUILD_TESTING=OFF
          source install/setup.bash
          check_urdf install/lc_robot_description/share/lc_robot_description/urdf/lc_sentry2027.urdf
          python3 src/lc_robot_description/test/test_model.py
          python3 src/pb2025_sentry_nav/pb2025_nav_bringup/test/robot_model_launch_test.py
      - name: Live TF and joint feedback
        shell: bash
        env:
          ROS_LOCALHOST_ONLY: '1'
          ROS_DOMAIN_ID: '168'
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 src/lc_robot_description/test/test_tf.py
