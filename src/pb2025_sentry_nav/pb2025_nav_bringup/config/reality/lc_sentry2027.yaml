# lc_sentry2027 只覆盖模型相关参数，其余导航参数沿用 params_file。
# Point-LIO 的 body/里程计是 IMU 坐标系；front_mid360 与 mid360_link 为同一雷达原点。
livox_ros_driver2:
  ros__parameters:
    frame_id: front_mid360
    user_config_path: $(find-pkg-share pb2025_nav_bringup)/config/reality/lc_sentry2027_mid360.json
loam_interface:
  ros__parameters:
    lidar_frame: mid360_imu
sensor_scan_generation:
  ros__parameters:
    lidar_frame: mid360_imu
    robot_base_frame: gimbal_yaw
terrain_analysis:
  ros__parameters:
    sensor_frame: mid360_imu
fake_vel_transform:
  ros__parameters:
    robot_base_frame: gimbal_yaw
    fake_robot_base_frame: gimbal_yaw_fake
small_gicp_relocalization:
  ros__parameters:
    lidar_frame: mid360_imu
    robot_base_frame: gimbal_yaw
bt_navigator:
  ros__parameters:
    robot_base_frame: gimbal_yaw_fake
local_costmap:
  local_costmap:
    ros__parameters:
      robot_base_frame: gimbal_yaw_fake
global_costmap:
  global_costmap:
    ros__parameters:
      robot_base_frame: gimbal_yaw_fake
behavior_server:
  ros__parameters:
    robot_base_frame: gimbal_yaw_fake
pb_teleop_twist_joy_node:
  ros__parameters:
    robot_base_frame: gimbal_yaw
